<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inkwell · Policy evidence</title>
<style>body{font:16px system-ui;background:#f7f6f2;color:#263b35;max-width:1200px;margin:40px auto;padding:0 24px}h1{font-size:40px}textarea{box-sizing:border-box;width:100%;height:230px;padding:18px;font:15px monospace;border:1px solid #b9c7bf;border-radius:12px}button{background:#245b48;color:white;border:0;border-radius:8px;padding:12px 18px;cursor:pointer}#results{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:30px}section{background:white;padding:20px;border-radius:12px;margin-bottom:15px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:15px/1.7 system-ui}mark{background:#ffe59d}small{color:#63746c}.clause{display:block;width:100%;text-align:left;margin:8px 0;background:#edf3ef;color:#263b35}#source{position:sticky;top:20px;max-height:75vh;overflow:auto}@media(max-width:700px){#results{grid-template-columns:1fr}}</style>
<h1>Inkwell</h1><p>Find privacy-policy clauses and verify the original evidence.</p><p><small>Research baseline. A missing match may reflect a classifier error. Not legal advice.</small></p>
<label for="policy">Paste the policy text</label><textarea id="policy" placeholder="Paste an unseen policy here. Separate paragraphs with blank lines."></textarea><p><button id="submit">Find clauses</button> <span id="status" role="status"></span></p>
<div id="results"><div id="findings"></div><section id="source" hidden><h2>Original policy</h2><pre id="original"></pre></section></div>
<script>
let data;const $=id=>document.getElementById(id);
function highlight(s){const chars=Array.from(data.text),p=$('original');p.replaceChildren(document.createTextNode(chars.slice(0,s.start).join('')));const mark=document.createElement('mark');mark.textContent=chars.slice(s.start,s.end).join('');p.append(mark,document.createTextNode(chars.slice(s.end).join('')));mark.scrollIntoView({block:'center',behavior:'smooth'});}
function card(title,category){const section=document.createElement('section'),heading=document.createElement('h3');heading.textContent=title;section.append(heading);const ids=data.coverage[category];if(!ids.length){const p=document.createElement('p');p.textContent=data.empty_message;section.append(p);}for(const id of ids){const s=data.segments[id],button=document.createElement('button');button.className='clause';button.textContent=s.text;button.onclick=()=>highlight(s);section.append(button);}$('findings').append(section);}
$('submit').onclick=async()=>{if(!$('policy').value.trim())return;$('submit').disabled=true;$('status').textContent='Classifying…';try{const response=await fetch('/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:$('policy').value})});if(!response.ok)throw Error('Analysis failed');data=await response.json();$('findings').replaceChildren();$('original').textContent=data.text;$('source').hidden=false;for(const [q,c]of Object.entries(data.faqs))card(q,c);for(const c of Object.keys(data.coverage))card(c,c);$('status').textContent=`${data.segments.length} segments checked. Click a clause to highlight its source.`;}catch(error){$('status').textContent=error.message;}finally{$('submit').disabled=false;}};
</script></html>
