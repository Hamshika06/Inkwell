<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Inkwell dashboard</title>
  <meta name="description" content="Your saved Inkwell checks.">
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;1,8..60,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="tour.css">
  <link rel="stylesheet" href="report.css">
  <script>try { var t = localStorage.getItem("inkwell-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}</script>
  <script src="config.js"></script>
  <script type="module" src="dashboard.js"></script>
  <link rel="stylesheet" href="looks.css">
  <script>try { var l = new URLSearchParams(location.search).get("look"); if (l) localStorage.setItem("inkwell-look", l === "off" ? "" : l); l = localStorage.getItem("inkwell-look"); if (l) document.documentElement.dataset.look = l; } catch (e) {}</script>
</head>
<body data-auth="pending">
  <header class="topbar">
    <a class="brand" href="/"><img class="brand-mark" src="logo.svg" alt=""><span class="brand-name">Inkwell</span></a>
    <div class="topbar-right">
      <nav class="app-nav" aria-label="Your work"><a class="btn btn-ghost" href="compare.html">Compare</a></nav>
      <button type="button" class="icon-btn" id="theme" aria-label="Switch light or dark theme" title="Switch theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <button type="button" class="btn btn-ghost" id="sign-out" hidden>Sign out</button>
    </div>
  </header>

  <main>
    <section class="dash-head">
      <div>
        <h1>Your dashboard</h1>
        <p>Every policy you check is saved here automatically. Open one to pick up where you left off. Starting a new check never changes your saved work.</p>
      </div>
      <a class="btn btn-primary btn-lg" href="app.html">+ Start a new check</a>
    </section>
    <p id="dash-where" class="fine" hidden></p>
    <section id="dash-list" aria-live="polite"></section>
  </main>
</body>
</html>
