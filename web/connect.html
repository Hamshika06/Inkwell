<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <meta name="robots" content="noindex">
  <link rel="icon" href="logo.svg?v=2" type="image/svg+xml">

<body>
  <main class="connect-page">

      <h1 id="title">Connecting the extension…</h1>
      <p id="message">One moment.</p>
      <p id="actions" hidden><a class="btn btn-primary" href="/app.html">Open Inkwell</a></p>
    </section>
  </main>

</html>
